name: Refresh events snapshot from calendar

# The site reads the church calendar LIVE through api/events.js. This job
# only refreshes the fallback copy in events-data.js so visitors still see
# recent events if the live read ever fails. It commits straight to main;
# there is no pull request and nothing for a person to approve.
#
# Runs weekly, and can also be run by hand from the Actions tab
# ("Run workflow" button).
#
# Note: GitHub pauses scheduled jobs after 60 days with no commits. If that
# happens, the live site is unaffected; only this fallback copy gets stale.
# Re-enable it from the Actions tab.
on:
  schedule:
    - cron: "0 13 * * 1" # every Monday, about 6am Pacific (13:00 UTC during PDT)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run calendar sync
        env:
          CHURCH_CALENDAR_ICS_URL: ${{ secrets.CHURCH_CALENDAR_ICS_URL }}
        run: npm run sync-events

      - name: Commit snapshot to main (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events-data.js
          if git diff --cached --quiet; then
            echo "Snapshot already up to date. Nothing to commit."
          else
            git commit -m "Refresh events snapshot from church calendar"
            git push
          fi
